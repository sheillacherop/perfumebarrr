<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | The Perfume Bar</title>
    <!-- Inter Sans-Serif for a minimalist, high-end look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --espresso: #291C0E;
            --mocha: #4A3728;
            --champagne: #E1D4C2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            font-family: 'Inter', sans-serif;
            background-color: var(--espresso);
            color: white;
            line-height: 1.6;
        }

        /* Hero Section with home.png background */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('images/home.png') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            color: var(--champagne);
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 3rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Story Section integrated into the home page */
        .story-content {
            max-width: 700px;
            background: rgba(41, 28, 14, 0.8);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border: 1px solid rgba(225, 212, 194, 0.2);
            margin-bottom: 3rem;
        }

        .story-content p {
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        /* Updated Navigation Buttons */
        .nav-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: var(--champagne);
            border: 1px solid var(--champagne);
            padding: 14px 28px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            min-width: 180px;
        }

        .nav-link:hover {
            background: var(--champagne);
            color: var(--espresso);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .story-content { padding: 1.5rem; }
            .nav-group { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <h1>The Perfume Bar</h1>
        <p class="tagline">Unleash Your Essence</p>

        <!-- Integrated Story Section -->
        <div class="story-content">
            <p>At The Perfume Bar, we believe fragrance is a statement of identity. Our mission is to spread happiness through beautiful scents, curating luxury designer brands and exclusive oils for the Nairobi soul.</p>
        </div>
        
        <!-- Streamlined Navigation -->
        <div class="nav-group">
            <a href="index.html" class="nav-link">Intro</a>
            <a href="shop.html" class="nav-link">Scent</a>
            <a href="close shop.html" class="nav-link">Announcements</a>
        </div>
    </section>

</body>
</html>
