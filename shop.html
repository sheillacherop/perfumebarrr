<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | The Perfume Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --espresso: #291C0E;
            --mocha: #4A3728;
            --champagne: #E1D4C2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(41, 28, 14, 0.85), rgba(41, 28, 14, 0.85)), 
                        url('images/home.png') center/cover no-repeat fixed;
            color: var(--champagne);
            min-height: 100vh;
            padding-top: 100px;
        }

        /* HEADER & NAVIGATION */
        .floating-cart {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(41, 28, 14, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--mocha);
            z-index: 1000;
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a {
            color: var(--champagne);
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0.7;
            transition: 0.3s;
        }
        .nav-links a:hover { opacity: 1; border-bottom: 1px solid var(--champagne); }

        .cart-info { font-size: 0.8rem; font-weight: 600; cursor: pointer; letter-spacing: 1px; }

        .btn-confirm {
            background: var(--champagne);
            color: var(--espresso);
            border: none;
            padding: 10px 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-confirm:hover { background: #fff; }

        /* NOTIFICATION TOAST */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--mocha);
            color: var(--champagne);
            text-align: center;
            border: 1px solid var(--champagne);
            padding: 16px;
            position: fixed;
            z-index: 3000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* SHOP LAYOUT */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 5%; }
        
        .category-header {
            text-align: center;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 80px 0 40px;
            font-size: 1.4rem;
            border-bottom: 1px solid rgba(225, 212, 194, 0.1);
            padding-bottom: 15px;
        }

        .perfume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .perfume-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(74, 55, 40, 0.5);
            padding: 20px;
            text-align: center;
            transition: 0.4s;
            cursor: pointer;
        }

        .perfume-card:hover { border-color: var(--champagne); transform: translateY(-5px); }
        .perfume-card img { width: 100%; height: 280px; object-fit: cover; margin-bottom: 15px; }
        .perfume-card h4 { font-size: 0.8rem; letter-spacing: 1.5px; margin-bottom: 10px; height: 40px; display: flex; align-items: center; justify-content: center; }

        /* BASKET DROPDOWN */
        #cartItemsList {
            position: absolute;
            top: 75px; right: 5%;
            background: var(--espresso);
            padding: 25px;
            display: none;
            width: 350px;
            border: 1px solid var(--champagne);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(225, 212, 194, 0.1);
            padding-bottom: 8px;
        }

        .remove-btn { color: #ff4d4d; cursor: pointer; padding-left: 15px; font-size: 0.9rem; }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: var(--espresso);
            border: 1px solid var(--champagne);
            padding: 50px 40px;
            width: 90%; max-width: 450px;
            text-align: center;
        }

        .option-btn {
            background: transparent;
            border: 1px solid var(--champagne);
            color: var(--champagne);
            padding: 15px;
            cursor: pointer;
            font-size: 0.75rem;
            margin: 10px 0;
            width: 100%;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .option-btn:hover { background: var(--champagne); color: var(--espresso); }
    </style>
</head>
<body>

    <div class="floating-cart">
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="#arabic">ARABIC</a>
            <a href="#designer">DESIGNER</a>
            <a href="#elite">ELITE</a>
            <a href="home.html">STORY</a>
            <a href="close shop.html">ANNOUNCEMENT</a>
        </div>
        <div class="cart-info" onclick="toggleCartList()">
            <i class="fas fa-shopping-basket"></i> <span id="cartCount">0</span> ITEMS | KSH <span id="cartTotal">0</span>
        </div>
        <button class="btn-confirm" onclick="confirmOrder()">Confirm Order</button>
        
        <div id="cartItemsList">
            <p style="font-size: 0.6rem; letter-spacing: 3px; margin-bottom: 20px; opacity: 0.6; text-align: center;">YOUR SELECTION</p>
            <div id="itemsContainer"></div>
        </div>
    </div>

    <div id="toast">Added to Basket</div>

    <div class="container">
        <h2 id="arabic" class="category-header">Arabic Collection</h2>
        <div class="perfume-grid" id="grid-arabic"></div>

        <h2 id="designer" class="category-header">Designer Collection</h2>
        <div class="perfume-grid" id="grid-designer"></div>

        <h2 id="elite" class="category-header">Elite Collection</h2>
        <div class="perfume-grid" id="grid-elite"></div>
    </div>

    <div id="perfumeModal" class="modal">
        <div class="modal-content">
            <h2 id="mTitle" style="letter-spacing: 4px; margin-bottom: 30px; font-weight: 300;"></h2>
            <button class="option-btn" id="addDecant">15ml Decant — KSH 3,500</button>
            <button class="option-btn" id="addFull">Full Bottle — KSH <span id="mPrice"></span></button>
            <p onclick="closeModal()" style="margin-top: 30px; font-size: 0.6rem; cursor: pointer; letter-spacing: 2px; opacity: 0.5;">CLOSE</p>
        </div>
    </div>

    <script>
        const perfumes = {
            arabic: [
                ['Khamarah Lattafa', 'Khamarah Lattafa.jpeg', 8500],
                ['mousuf EAU DE PARFUM', 'mousuf EAU DE PARFUM.jpeg', 8000],
                ['mousuf RAMADI', 'mousuf RAMADI.jpeg', 8000],
                ['Ruby Fizz', 'Ruby Fizz.jpeg', 8000],
                ['Vanilla Voyage', 'Vanilla Voyage.jpeg', 8500],
                ['9pm NIGHT OUT', '9pm NIGHT OUT.jpeg', 8000],
                ['9pm Rebel', '9pm Rebel.jpeg', 8000],
                ['Ameerat Al Arab Prive Rose', 'Ameerat Rose.jpeg', 9000],
                ['Dhukhan Lattafa', 'Dhukhan Lattafa.jpeg', 8500],
                ['Hayaati', 'Hayaati.jpeg', 8000]
            ],
            designer: [
                ['My Burberry', 'My Burberry.jpeg', 12500],
                ['Prada', 'Prada.jpeg', 13000],
                ['Sauvage Dior', 'Sauvage Dior.jpeg', 14500],
                ['Terre D\'hermes', 'Terre D\'hermes.jpeg', 12000],
                ['Versace', 'Versace.jpeg', 11500],
                ['YSL Libre', 'Yves Saint Laurent Libre.jpeg', 14000],
                ['Yves Saint Laurent', 'Yves Saint Laurent.jpeg', 13500],
                ['Black Opium', 'Black Opium.jpeg', 14000],
                ['Calvin Klein', 'Calvin Klein.jpeg', 11000],
                ['Giorgio Armani', 'Giorgio Armani.jpeg', 13500],
                ['Gucci Bloom Intense', 'Gucci Bloom Intense.jpeg', 14500],
                ['J\'adore l\'Or', 'J\'adore l\'Or.jpeg', 14500],
                ['Kayali EDEN JUICE APPLE', 'Kayali EDEN JUICE APPLE.jpeg', 13000],
                ['Kayali LOVEFEST BURNING CHERRY', 'Kayali LOVEFEST BURNING CHERRY.jpeg', 13000]
            ],
            elite: [
                ['Ombre Nomade', 'Ombre Nomade.jpeg', 15000],
                ['Nuit De Feu', 'Nuit De Feu.jpeg', 15000],
                ['MFK Baccarat Rouge 540', 'mfk-baccarat.jpeg', 15000],
                ['MFK Extrait de parfum', 'mfk-extrait.jpeg', 15000],
                ['Bergamote', 'Bergamote.jpeg', 15000],
                ['Cocktail Intense', 'Cocktail Intense.jpeg', 15000],
                ['Contre Moi', 'Contre Moi.jpeg', 15000],
                ['Imagination', 'Imagination.jpeg', 15000],
                ['Impadia', 'Impadia.jpeg', 15000]
            ]
        };

        let cart = [];

        function renderAll() {
            for (let cat in perfumes) {
                const grid = document.getElementById(`grid-${cat}`);
                perfumes[cat].forEach(p => {
                    grid.innerHTML += `
                        <div class="perfume-card" onclick="openModal('${p[0].replace(/'/g, "\\'")}', '${p[1]}', ${p[2]})">
                            <img src="images/${p[1]}" alt="${p[0]}">
                            <h4>${p[0]}</h4>
                            <p style="font-size: 0.65rem; opacity: 0.5; letter-spacing: 1px;">SELECT SIZE</p>
                        </div>`;
                });
            }
        }

        function openModal(name, img, price) {
            document.getElementById('mTitle').innerText = name;
            document.getElementById('mPrice').innerText = price.toLocaleString();
            document.getElementById('perfumeModal').style.display = 'flex';
            document.getElementById('addDecant').onclick = () => addToCart(name + " (15ml)", 3500);
            document.getElementById('addFull').onclick = () => addToCart(name + " (Full Bottle)", price);
        }

        function closeModal() { document.getElementById('perfumeModal').style.display = 'none'; }

        function addToCart(label, price) {
            cart.push({ label, price });
            showToast();
            updateUI();
            closeModal();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateUI();
        }

        function showToast() {
            const t = document.getElementById("toast");
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        }

        function updateUI() {
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('cartCount').innerText = cart.length;
            document.getElementById('cartTotal').innerText = total.toLocaleString();
            document.getElementById('itemsContainer').innerHTML = cart.map((i, index) => `
                <div class="cart-item">
                    <span>${i.label}</span>
                    <span>KSH ${i.price.toLocaleString()} <i class="fas fa-times remove-btn" onclick="removeFromCart(${index})"></i></span>
                </div>
            `).join('');
        }

        function toggleCartList() {
            const list = document.getElementById('cartItemsList');
            list.style.display = list.style.display === 'block' ? 'none' : 'block';
        }

        function confirmOrder() {
            if(cart.length === 0) return alert("Your basket is empty.");
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            let details = cart.map(i => i.label).join(", ");
            let text = `Hii Ms. Mutaii! I'd like to order from The Perfume Bar: ${details}. Total: KSH ${total.toLocaleString()}`;
            window.open(`https://wa.me/254708727556?text=${encodeURIComponent(text)}`, '_blank');
        }

        renderAll();
    </script>
</body>
</html>
