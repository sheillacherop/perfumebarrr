<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Perfume Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .main-container {
            position: relative;
            /* Full screen to ensure your image fits exactly as you see it */
            width: 100vw; 
            height: 100vh;
            background: url('images/image.png') center/cover no-repeat;
        }

        /* POSITIONING THE BUTTON AREA */
        .cta-wrapper {
            position: absolute;
            /* Adjusted to sit right below the static 'Contact' text in your image */
            top: 10%; 
            right: 6%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        /* THE CUTE POPUP */
        .popup-hint {
            background: #E1D4C2; 
            color: #291C0E;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            position: relative;
            animation: bounce 2s infinite;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        /* Triangle for the popup */
        .popup-hint::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid #E1D4C2;
        }

        /* THE BUTTON */
        .btn-discover {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid #E1D4C2;
            color: #E1D4C2;
            padding: 12px 30px;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-discover:hover {
            background: #E1D4C2;
            color: #1a140f;
            transform: translateY(-2px);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-6px);}
            60% {transform: translateY(-3px);}
        }

        /* Ensuring it looks good on phones too */
        @media (max-width: 768px) {
            .cta-wrapper {
                top: 12%;
                right: 50%;
                transform: translateX(50%); /* Centers it for mobile users */
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- This div sits on top of the image's non-functional navigation -->
        <div class="cta-wrapper">
            <div class="popup-hint">Click here!</div>
            <a href="home.html".html" class="btn-discover">Discover Now</a>
        </div>
    </div>

</body>
</html>
